version: 2
updates:
  # The libraries have no dependencies; these are test, build and tool packages.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      packages:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
