name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the version from tags
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Docs are up to date
        run: dotnet run --project tools/SharpCell.Docs -c Release -f net10.0 --no-build -- check
      - name: Compatibility report is up to date
        run: dotnet run --project tools/SharpCell.Conformance -c Release -f net10.0 --no-build -- --check
      - name: Pack
        run: dotnet pack SharpCell.slnx -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish with NativeAOT
        run: dotnet publish tests/SharpCell.AotSmoke -c Release -f net10.0 -o artifacts/aot
      - name: Run
        run: artifacts/aot/SharpCell.AotSmoke samples/SharpCell.Sample/budget.xlsx
