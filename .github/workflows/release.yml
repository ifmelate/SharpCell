name: release

# Push a tag such as v0.1.0: the packages get that version (MinVer), are tested, published to
# nuget.org through Trusted Publishing (no API key stored) and attached to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # Trusted Publishing on nuget.org

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Pack
        run: dotnet pack SharpCell.slnx -c Release --no-build -o artifacts/packages
      - name: Version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for id in SharpCell SharpCell.Xlsx; do
            if [ ! -f "artifacts/packages/$id.$version.nupkg" ]; then
              echo "::error::Expected $id.$version.nupkg"; ls artifacts/packages; exit 1
            fi
          done
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ifmelate
      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* --title "SharpCell $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
